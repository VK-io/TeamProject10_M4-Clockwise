name: Daily Canvas Watcher Poll

on:
  schedule:
  #Run every 6 hours
  - cron: '0 */6 * * *'
  workflow_dispatch: #Manual mode

jobs:
  poll-Canvas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Run Watcher for all registered users
        if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NRP_BASE_URL: ${{ secrets.NRP_BASE_URL }}
          NRP_API_KEY: ${{ secrets.NRP_API_KEY }}
          NRP_MODEL: ${{ secrets.NRP_MODEL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python -m src.watcher --all-users

      - name: Ping Streamlit to prevent sleep
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [-n "$APP_URL"]; then
            curl -s -L "$APP_URL" > /dev/null || true
          fi
      